<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Anatomy Trivia – Player</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1e2a3a;
    --accent: #00e5ff;
    --accent2: #ff4081;
    --accent3: #69ff47;
    --text: #f0f4ff;
    --muted: #8899aa;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Syne', sans-serif; }

  .screen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px 20px; text-align: center; gap: 20px;
  }
  .screen.active { display: flex; }

  /* ── Join ── */
  .join-title {
    font-size: 2.2rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .input-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .input-field {
    background: var(--surface2);
    border: 2px solid var(--surface2);
    border-radius: 10px;
    color: var(--text);
    font-size: 1.1rem;
    font-family: 'DM Sans', sans-serif;
    padding: 14px 18px;
    outline: none;
    transition: border-color .2s;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .input-field:focus { border-color: var(--accent); }
  .input-field.name-input { text-transform: none; letter-spacing: 0; }
  .btn {
    background: var(--accent); color: #000;
    border: none; border-radius: 40px;
    padding: 16px 40px;
    font-size: 1.1rem; font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer; width: 100%;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:active { transform: scale(0.96); }
  .error-msg { color: var(--accent2); font-size: 0.9rem; min-height: 20px; }

  /* ── Waiting ── */
  .waiting-anim {
    width: 80px; height: 80px;
    border: 4px solid var(--surface2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .player-name-display {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem; font-weight: 800; color: var(--accent);
  }

  /* ── Question ── */
  #q-screen { justify-content: flex-start; padding-top: 24px; gap: 16px; }
  .q-timer-bar-wrap {
    width: 100%; height: 10px; background: var(--surface2); border-radius: 10px;
  }
  #q-timer-bar {
    height: 100%; background: var(--accent); border-radius: 10px;
    transition: width 1s linear, background 1s;
  }
  .q-num { color: var(--muted); font-size: 0.9rem; }
  .q-text-player {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.2rem, 5vw, 1.6rem);
    font-weight: 700;
    line-height: 1.3;
    margin: 4px 0;
  }
  .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .choice-btn {
    padding: 20px 14px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    font-size: 1rem; font-weight: 600;
    text-align: left;
    cursor: pointer;
    line-height: 1.3;
    position: relative;
    transition: transform .15s, opacity .3s;
  }
  .choice-btn:active { transform: scale(0.96); }
  .choice-btn .ltr {
    display: block; font-family: 'Syne', sans-serif;
    font-size: 1.2rem; font-weight: 800; margin-bottom: 4px;
  }
  .choice-btn.A { background: rgba(255,64,129,0.15); border-color: #ff4081; color: var(--text); }
  .choice-btn.B { background: rgba(0,229,255,0.12); border-color: #00e5ff; color: var(--text); }
  .choice-btn.C { background: rgba(105,255,71,0.12); border-color: #69ff47; color: var(--text); }
  .choice-btn.D { background: rgba(167,139,250,0.12); border-color: #a78bfa; color: var(--text); }
  .choice-btn.selected { transform: scale(0.97); opacity: 0.7; }
  .choice-btn.correct { background: rgba(105,255,71,0.3) !important; border-color: #69ff47 !important; opacity: 1 !important; }
  .choice-btn.wrong { opacity: 0.3 !important; }
  .choice-btn:disabled { cursor: default; }

  /* ── Result flash ── */
  #result-flash {
    display: none; position: fixed; inset: 0;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 2rem; font-weight: 800;
    z-index: 99; gap: 12px;
  }
  #result-flash.correct { background: rgba(10,40,15,0.97); color: var(--accent3); }
  #result-flash.wrong { background: rgba(40,10,15,0.97); color: var(--accent2); }
  .result-icon { font-size: 4rem; }
  .pts-earned { font-size: 3rem; color: var(--accent); }

  /* ── Leaderboard player ── */
  .lb-row-p {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border-radius: var(--radius);
    padding: 12px 18px; width: 100%; max-width: 380px;
    animation: slideIn .4s both;
  }
  .lb-row-p.me { border: 2px solid var(--accent); }
  @keyframes slideIn { from{transform:translateX(-30px);opacity:0} to{transform:translateX(0);opacity:1} }
  .lb-rank-p { font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:800; width:28px; }
  .lb-name-p { flex:1; font-weight:600; }
  .lb-score-p { font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:800; color:var(--accent); }

  .screen-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem; font-weight: 800;
  }
  .muted { color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <div class="join-title">🫀 Anatomy Trivia</div>
  <p style="color:var(--muted)">Enter the game code from your teacher's screen and your name.</p>
  <div class="input-group">
    <input class="input-field" id="code-input" maxlength="5" placeholder="GAME CODE" autocomplete="off" spellcheck="false"/>
    <input class="input-field name-input" id="name-input" maxlength="16" placeholder="Your name" autocomplete="off"/>
    <button class="btn" id="join-btn">Join Game</button>
  </div>
  <div class="error-msg" id="error-msg"></div>
</div>

<!-- WAITING -->
<div id="wait-screen" class="screen">
  <div class="waiting-anim"></div>
  <div class="player-name-display" id="my-name-display"></div>
  <p style="color:var(--muted)">You're in! Waiting for the host to start…</p>
</div>

<!-- QUESTION -->
<div id="q-screen" class="screen">
  <div class="q-timer-bar-wrap"><div id="q-timer-bar"></div></div>
  <div class="q-num" id="q-num">Question 1</div>
  <div class="q-text-player" id="q-text-player"></div>
  <div class="answer-grid" id="answer-grid"></div>
  <div id="answered-msg" style="display:none; color:var(--muted); font-size:0.95rem; margin-top:8px">Answer locked in! ⏳</div>
</div>

<!-- RESULT FLASH -->
<div id="result-flash">
  <div class="result-icon" id="result-icon"></div>
  <div id="result-text"></div>
  <div class="pts-earned" id="pts-earned"></div>
</div>

<!-- LEADERBOARD -->
<div id="lb-screen" class="screen">
  <div class="screen-title">📊 Leaderboard</div>
  <div id="lb-list-player" style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;"></div>
  <p class="muted" style="margin-top:12px">Next question loading…</p>
</div>

<!-- GAME OVER -->
<div id="over-screen" class="screen">
  <div style="font-size:3rem">🏆</div>
  <div class="screen-title" style="color:#ffd700">Game Over!</div>
  <div id="final-rank-msg" style="color:var(--muted);font-size:1.1rem;"></div>
  <div id="lb-list-final" style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;"></div>
</div>

<script>
let myId = Math.random().toString(36).substring(2,10);
let myName = '';
let gameCode = '';
let bc = null;
let timerInterval = null;
let answered = false;
let lastCorrect = false;
let currentTimer = 20;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.style.display='none'; });
  const el = document.getElementById(id);
  el.style.display = 'flex';
  el.classList.add('active');
}

document.getElementById('join-btn').onclick = joinGame;
document.getElementById('code-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('name-input').focus(); });
document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') joinGame(); });

function joinGame() {
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  const name = document.getElementById('name-input').value.trim();
  const err = document.getElementById('error-msg');

  if (!code || code.length < 3) { err.textContent = 'Enter a valid game code.'; return; }
  if (!name || name.length < 1) { err.textContent = 'Enter your name.'; return; }
  err.textContent = '';

  gameCode = code;
  myName = name;
  bc = new BroadcastChannel('anatomy_trivia_' + gameCode);

  bc.onmessage = handleMessage;

  // Try to join
  bc.postMessage({ type: 'join', id: myId, name: myName });

  // Wait for confirmation
  setTimeout(() => {
    if (document.getElementById('join-screen').classList.contains('active')) {
      err.textContent = 'No game found with that code. Check with your teacher.';
    }
  }, 1500);
}

function handleMessage(e) {
  const msg = e.data;
  if (msg.type === 'joined' && msg.id === myId) {
    document.getElementById('my-name-display').textContent = myName;
    show('wait-screen');
  }
  if (msg.type === 'question') {
    answered = false;
    document.getElementById('answered-msg').style.display = 'none';
    showQuestion(msg);
  }
  if (msg.type === 'answer_ack' && msg.id === myId) {
    lastCorrect = msg.correct;
    showResultFlash(msg.correct, msg.pts, msg.correctAnswer);
  }
  if (msg.type === 'reveal') {
    // Reveal correct answer on buttons if not already done
    revealAnswer(msg.correctAnswer);
  }
  if (msg.type === 'leaderboard') {
    showLeaderboard(msg.scores);
  }
  if (msg.type === 'gameover') {
    showGameOver(msg.scores);
  }
}

function showQuestion(msg) {
  document.getElementById('q-num').textContent = `Question ${msg.qIndex + 1}`;
  document.getElementById('q-text-player').textContent = msg.q;

  const grid = document.getElementById('answer-grid');
  const COLORS = ['A','B','C','D'];
  grid.innerHTML = msg.answers.map((ans, i) => `
    <button class="choice-btn ${COLORS[i]}" data-i="${i}" onclick="submitAnswer(${i})">
      <span class="ltr">${COLORS[i]}</span>${ans}
    </button>
  `).join('');

  currentTimer = msg.timer || 20;
  startTimerBar(currentTimer);
  show('q-screen');
}

function startTimerBar(t) {
  clearInterval(timerInterval);
  const bar = document.getElementById('q-timer-bar');
  bar.style.width = '100%';
  bar.style.background = '#00e5ff';
  let left = t;
  timerInterval = setInterval(() => {
    left--;
    const pct = left / t * 100;
    bar.style.width = pct + '%';
    bar.style.background = pct > 50 ? '#00e5ff' : pct > 25 ? '#ffb300' : '#ff4081';
    if (left <= 0) clearInterval(timerInterval);
  }, 1000);
}

function submitAnswer(i) {
  if (answered) return;
  answered = true;
  document.getElementById('answered-msg').style.display = 'block';
  document.querySelectorAll('.choice-btn').forEach((b,idx) => {
    b.disabled = true;
    if (idx === i) b.classList.add('selected');
    else b.style.opacity = '0.4';
  });
  bc.postMessage({ type: 'answer', id: myId, answer: i, time: Date.now() });
}

function revealAnswer(correct) {
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('correct');
    else b.classList.add('wrong');
  });
}

function showResultFlash(correct, pts, correctAnswer) {
  revealAnswer(correctAnswer);
  const flash = document.getElementById('result-flash');
  flash.className = correct ? 'correct' : 'wrong';
  document.getElementById('result-icon').textContent = correct ? '✅' : '❌';
  document.getElementById('result-text').textContent = correct ? 'Correct!' : 'Wrong!';
  document.getElementById('pts-earned').textContent = correct ? `+${pts.toLocaleString()} pts` : '';
  flash.style.display = 'flex';
  setTimeout(() => { flash.style.display = 'none'; }, 2000);
}

function showLeaderboard(scores) {
  const list = document.getElementById('lb-list-player');
  list.innerHTML = scores.slice(0,8).map((p, i) => `
    <div class="lb-row-p ${p.name===myName?'me':''}" style="animation-delay:${i*0.07}s">
      <div class="lb-rank-p">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-name-p">${p.name}${p.name===myName?' 👈':''}</div>
      <div class="lb-score-p">${p.score.toLocaleString()}</div>
    </div>
  `).join('');
  show('lb-screen');
}

function showGameOver(scores) {
  const myRank = scores.findIndex(p => p.name === myName) + 1;
  document.getElementById('final-rank-msg').textContent = `You finished #${myRank} out of ${scores.length} players!`;
  const list = document.getElementById('lb-list-final');
  list.innerHTML = scores.map((p, i) => `
    <div class="lb-row-p ${p.name===myName?'me':''}" style="animation-delay:${i*0.07}s">
      <div class="lb-rank-p">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-name-p">${p.name}${p.name===myName?' 👈':''}</div>
      <div class="lb-score-p">${p.score.toLocaleString()}</div>
    </div>
  `).join('');
  show('over-screen');
}
</script>
</body>
</html>
